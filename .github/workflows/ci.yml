name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Lint, types, unit, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Paraglide generates src/lib/paraglide during the build, and both
      # svelte-check and eslint need it to exist.
      - run: pnpm run build

      - run: pnpm run lint

      - run: pnpm run check

      - name: Unit tests (ledger)
        run: pnpm run test:unit

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (Chromium gate, includes axe)
        run: pnpm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
